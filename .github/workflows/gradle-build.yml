# Builds the mod on every push; on tags it also publishes the jar as a GitHub release.

name: Gradle Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      java_version: ${{ steps.compatibility.outputs.java_version }}
      minecraft_version: ${{ steps.compatibility.outputs.minecraft_version }}
      loader_version: ${{ steps.compatibility.outputs.loader_version }}
      fabric_version: ${{ steps.compatibility.outputs.fabric_version }}
      cloth_version: ${{ steps.compatibility.outputs.cloth_version }}
      menu_version: ${{ steps.compatibility.outputs.menu_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true

      # The version is derived from the last tag, which a shallow clone may not reach
      - name: Deepen until git describe works
        shell: bash
        run: |
          set -euo pipefail

          # Try to get a describe string; empty means "no tag reachable yet"
          try_describe() {
            git describe --tags --first-parent 2>/dev/null || true
          }

          # If it already works, we're done.
          d="$(try_describe)"
          if [[ -n "$d" ]]; then
            echo "describe=$d"
            exit 0
          fi

          # Cap to avoid infinite loops on repos with no tags reachable on this branch.
          max_steps=100
          step=0

          while [[ $step -lt $max_steps ]]; do
            step=$((step + 1))

            # deepen by 10 commits
            git fetch --deepen=10 --tags origin

            d="$(try_describe)"
            if [[ -n "$d" ]]; then
              echo "describe=$d"
              echo "Reached a tag after $step deepen step(s)."
              exit 0
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: gradle build

      - name: Get release compatibility
        id: compatibility
        if: github.ref_type == 'tag'
        run: gradle -q printReleaseMetadata >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  # Only for tags: publishes the jar the build job made
  release:
    needs: [ build ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: mod-jar
          path: dist

      - name: Get JAR info for release
        id: jar_info
        run: |
          JAR_FILE=$(find dist -name "*.jar" ! -name "*-sources.jar" | head -1)
          JAR_NAME=$(basename "$JAR_FILE")
          FILE_SIZE=$(stat -c%s "$JAR_FILE" | numfmt --to=iec)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            Client-side Fabric mod that colors your chat input while you are in community or staff chat, made for survivewith.us.

            **Download:** [${{ steps.jar_info.outputs.jar_name }}](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.jar_info.outputs.jar_name }})
            **File Size:** ${{ steps.jar_info.outputs.file_size }}

            ### Compatibility
            - Minecraft ${{ needs.build.outputs.minecraft_version }}
            - Java ${{ needs.build.outputs.java_version }}+
            - Fabric Loader ${{ needs.build.outputs.loader_version }}+

            ### Dependencies
            - Required: Fabric API (built against `${{ needs.build.outputs.fabric_version }}`), Cloth Config (`${{ needs.build.outputs.cloth_version }}`)
            - Optional: Mod Menu (`${{ needs.build.outputs.menu_version }}`), for the in-game config screen

            ### Highlights
            - Community chat highlighting, from the server's reported state or guessed from typed commands
            - Staff chat highlighting on servers that report it
            - Server integration over the `comchatutil:chat_state` channel (see README)

            ### Installation
            1. Download the JAR file above.
            2. Place it in your client's `mods/` directory, together with Fabric API and Cloth Config.
            3. Start Minecraft with the Fabric loader.

            ---

            Built automatically from commit ${{ github.sha }}
          files: ${{ steps.jar_info.outputs.jar_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
