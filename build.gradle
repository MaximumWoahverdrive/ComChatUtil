plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.palantir.git-version' version '5.2.0'
}

def gitDetails = versionDetails()
def lastTag = gitDetails.lastTag.replaceFirst('^v', '')
// check if the working directory is clean using git status --porcelain
def isClean = 'git status --porcelain'.execute().text.trim().isEmpty()
// Format: <tag>-r<commits>.<hash>+<minecraft version>[.dirty]
def versionSuffix = gitDetails.commitDistance > 0 ? "-r${gitDetails.commitDistance}.${gitDetails.gitHash.take(7)}" : ""
def dirtySuffix = isClean ? '' : '.dirty'
version = "${lastTag}${versionSuffix}+${project.minecraft_version}${dirtySuffix}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    api "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
    api "com.terraformersmc:modmenu:${project.menu_version}"
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version
    ]
    inputs.properties props
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = base.archivesName
    inputs.property "archivesName", archivesName
    from("LICENSE") {
        rename { "${it}_${archivesName.get()}" }
    }
}

tasks.register("printReleaseMetadata") {
    def props = [
            java_version     : java.targetCompatibility.majorVersion,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version,
            fabric_version   : project.fabric_version,
            cloth_version    : project.cloth_version,
            menu_version     : project.menu_version
    ]
    doLast {
        props.each { k, v -> println("${k}=${v}") }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
